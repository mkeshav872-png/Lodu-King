<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Ludo King by Keshav Mishra</title>
    <style>
        :root {
            color-scheme: dark;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            --s: min(94vw, calc(100vh - 300px), 600px);
            background: radial-gradient(circle at 50% 0, #5b3fa8, #1d0f45 70%);
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent
        }

        .ttl {
            font-weight: 900;
            letter-spacing: 3px;
            font-size: clamp(20px, 4vh, 30px);
            background: linear-gradient(90deg, #ffe082, #ff8a65);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1
        }

        .by {
            font-size: 12px;
            opacity: .75;
            margin-top: -6px;
            letter-spacing: 1px
        }

        #bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            width: var(--s)
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #ffffff18;
            border: 2px solid transparent;
            font-size: 12px;
            opacity: .55;
            transition: .25s
        }

        .chip b {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--c)
        }

        .chip.on {
            opacity: 1;
            border-color: var(--c);
            box-shadow: 0 0 14px var(--c);
            transform: scale(1.06)
        }

        #board {
            position: relative;
            width: var(--s);
            height: var(--s);
            border-radius: 12px;
            box-shadow: 0 12px 40px #000a
        }

        #grid {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template: repeat(15, 1fr)/repeat(15, 1fr);
            border: 3px solid #1b1b1b;
            border-radius: 12px;
            overflow: hidden;
            background: #fff
        }

        .c {
            border: .5px solid #0003;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--s)/26);
            color: #0006;
            line-height: 1
        }

        .c.y {
            border: none
        }

        .c.n {
            border: none
        }

        #ctr {
            position: absolute;
            left: 40%;
            top: 40%;
            width: 20%;
            height: 20%;
            background: conic-gradient(from -45deg, #2e9e44 0 90deg, #f9b600 90deg 180deg, #1e88e5 180deg 270deg, #e53935 270deg 360deg);
            border: 1px solid #0005;
            box-sizing: border-box
        }

        .yb {
            position: absolute;
            width: 26.67%;
            height: 26.67%;
            background: #fff;
            border-radius: 14%;
            box-shadow: inset 0 0 10px #0005;
            transition: .3s
        }

        .yb.act {
            box-shadow: inset 0 0 10px #0005, 0 0 0 3px #fff, 0 0 22px 6px var(--gc);
        }

        .slot {
            position: absolute;
            width: 7.4%;
            aspect-ratio: 1;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: var(--sc);
            opacity: .4;
            box-shadow: inset 0 2px 5px #0008
        }

        .tk {
            position: absolute;
            width: 5.7%;
            aspect-ratio: 1;
            transform: translate(-50%, -50%) scale(var(--sc, 1));
            transition: left .17s linear, top .17s linear, transform .2s;
            cursor: pointer
        }

        .tk.ret {
            transition: left .6s ease-in, top .6s ease-in, transform .2s
        }

        .tki {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 28%, #fffa, transparent 42%), var(--tc);
            border: 2.5px solid #fff;
            box-sizing: border-box;
            box-shadow: 0 3px 5px #000a, inset 0 -3px 5px #0006;
            position: relative
        }

        .tki::after {
            content: "";
            position: absolute;
            inset: 30%;
            border-radius: 50%;
            background: #fff6;
            box-shadow: inset 0 1px 3px #0006
        }

        .tk.can .tki {
            animation: pul .55s infinite alternate;
            box-shadow: 0 0 0 3px #fff, 0 0 14px 4px #fff
        }

        .tk.hop .tki {
            animation: hop .19s
        }

        @keyframes pul {
            to {
                transform: translateY(-22%) scale(1.18)
            }
        }

        @keyframes hop {
            50% {
                transform: translateY(-50%) scale(1.25)
            }
        }

        #dock {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: var(--s);
            min-height: 84px
        }

        .die {
            --pc: #fff;
            width: 66px;
            height: 66px;
            flex: none;
            background: linear-gradient(135deg, #fff, #ddd);
            border-radius: 15px;
            display: grid;
            grid-template: repeat(3, 1fr)/repeat(3, 1fr);
            padding: 9px;
            box-sizing: border-box;
            border: 4px solid var(--pc);
            box-shadow: 0 6px 0 #aaa, 0 12px 18px #0007;
            cursor: pointer;
            transition: border-color .3s
        }

        .die i {
            border-radius: 50%;
            margin: 14%
        }

        .die i.p {
            background: radial-gradient(circle at 35% 30%, #555, #111)
        }

        .die.ready {
            animation: bob .6s infinite alternate
        }

        .die.roll {
            animation: shk .1s infinite
        }

        @keyframes bob {
            to {
                transform: translateY(-6px) rotate(-4deg)
            }
        }

        @keyframes shk {
            0% {
                transform: rotate(-14deg) scale(1.1)
            }

            50% {
                transform: rotate(12deg) translateY(-8px) scale(1.15)
            }

            100% {
                transform: rotate(-8deg) scale(1.1)
            }
        }

        #msg {
            font-size: 15px;
            font-weight: 600;
            min-width: 150px;
            text-align: left
        }

        .top {
            position: fixed;
            top: calc(8px + env(safe-area-inset-top, 0px));
            right: 8px;
            display: flex;
            gap: 6px;
            z-index: 20
        }

        button {
            font: inherit;
            color: #fff;
            cursor: pointer
        }

        .top button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: #ffffff25;
            font-size: 18px
        }

        .ov {
            position: fixed;
            inset: 0;
            background: #000a;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100
        }

        .ov.hide {
            display: none
        }

        .card {
            background: linear-gradient(#4a3596, #22145a);
            padding: 24px 22px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 20px 60px #000c, inset 0 1px #fff3;
            width: min(92vw, 360px);
            animation: pop .4s cubic-bezier(.2, 1.5, .5, 1)
        }

        @keyframes pop {
            from {
                transform: scale(.6);
                opacity: 0
            }
        }

        .card h2 {
            margin: 0;
            font-size: 30px;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffe082, #ff8a65);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .card p {
            margin: 2px 0 14px;
            font-size: 13px;
            opacity: .8
        }

        .card h4 {
            margin: 14px 0 6px;
            font-size: 13px;
            opacity: .8;
            font-weight: 600
        }

        .row {
            display: flex;
            gap: 8px;
            justify-content: center
        }

        .opt {
            flex: 1;
            padding: 10px 6px;
            border-radius: 12px;
            border: 2px solid #fff3;
            background: #ffffff14;
            font-weight: 700
        }

        .opt.sel {
            background: #ffb300;
            border-color: #fff;
            color: #2a1a00
        }

        .go {
            margin-top: 18px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(#69d36e, #2e9e44);
            box-shadow: 0 5px 0 #1b6b2b
        }

        .go:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1b6b2b
        }

        .rk {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            margin: 6px 0;
            border-radius: 12px;
            background: #ffffff18;
            text-align: left;
            font-weight: 700
        }

        .rk b {
            width: 14px;
            height: 14px;
            border-radius: 50%
        }

        .cf {
            position: fixed;
            top: -20px;
            width: 9px;
            height: 15px;
            z-index: 101;
            pointer-events: none;
            animation: fall linear forwards
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg)
            }
        }

        body[data-th="1"] {
            background: radial-gradient(circle at 50% 0, #ff9800, #6a1b00 75%)
        }

        body[data-th="2"] {
            background: radial-gradient(circle at 50% 0, #ff80ab, #6a1b4d 75%)
        }

        body[data-th="3"] {
            background: radial-gradient(circle at 50% 0, #66bb6a, #0d3b1e 75%)
        }

        .ttl,
        .card h2 {
            animation: glow 2s infinite alternate
        }

        @keyframes glow {
            to {
                filter: drop-shadow(0 0 10px #ffb300)
            }
        }

        .c.st {
            animation: tw 1.4s infinite alternate
        }

        @keyframes tw {
            to {
                color: #ffb300;
                transform: scale(1.3)
            }
        }

        #board.shake {
            animation: sh .4s
        }

        @keyframes sh {
            20% {
                transform: translate(-7px, 3px)
            }

            40% {
                transform: translate(7px, -3px)
            }

            60% {
                transform: translate(-4px, -2px)
            }

            80% {
                transform: translate(3px, 2px)
            }
        }

        .pt {
            position: absolute;
            width: 2.4%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--pc);
            pointer-events: none;
            z-index: 50;
            transform: translate(-50%, -50%);
            animation: pt .7s ease-out forwards
        }

        @keyframes pt {
            to {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0);
                opacity: 0
            }
        }

        .em {
            position: absolute;
            font-size: calc(var(--s)/9);
            z-index: 60;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: em 1.6s ease-out forwards
        }

        @keyframes em {
            0% {
                transform: translate(-50%, -50%) scale(.3);
                opacity: 0
            }

            20% {
                transform: translate(-50%, -80%) scale(1.3);
                opacity: 1
            }

            100% {
                transform: translate(-50%, -260%) scale(1);
                opacity: 0
            }
        }

        #emo {
            display: flex;
            gap: 8px
        }

        #emo button {
            font-size: 20px;
            background: #ffffff1c;
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px
        }

        #emo button:active {
            transform: scale(1.35)
        }

        #msg.p {
            animation: mp .35s
        }

        @keyframes mp {
            from {
                transform: scale(.7);
                opacity: 0
            }
        }

        .die.land {
            animation: ld .35s
        }

        @keyframes ld {
            40% {
                transform: scale(1.35) rotate(8deg)
            }
        }

        .die.roll {
            animation: thr .5s linear infinite
        }

        @keyframes thr {
            0% {
                transform: translateY(0) rotate(0) scale(1)
            }

            50% {
                transform: translateY(-28px) rotate(180deg) scale(1.3)
            }

            100% {
                transform: translateY(0) rotate(360deg) scale(1)
            }
        }

        .yb.act {
            animation: ya .9s infinite alternate
        }

        @keyframes ya {
            to {
                transform: scale(1.05)
            }
        }

        #spl {
            z-index: 200;
            background: radial-gradient(circle, #5b3fa8, #12082e);
            flex-direction: column;
            gap: 6px;
            transition: opacity .6s
        }

        #spl.out {
            opacity: 0;
            pointer-events: none
        }

        #spl .big {
            font-size: 70px;
            animation: spin 1.1s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .lb {
            width: 210px;
            height: 8px;
            background: #fff2;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 14px
        }

        .lb i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #ffe082, #ff8a65);
            animation: ld2 1.8s forwards
        }

        @keyframes ld2 {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }

        body {
            touch-action: manipulation;
            --s: min(94vw, calc(100vh - 330px), 600px)
        }

        @supports(height:100dvh) {
            body {
                --s: min(94vw, calc(100dvh - 330px), 600px)
            }
        }

        @media (max-height:520px) and (orientation:landscape) {
            body {
                --s: calc(100vh - 16px);
                flex-direction: column;
                flex-wrap: wrap;
                align-content: center;
                gap: 6px 18px
            }

            #board {
                order: -1
            }

            #bar,
            #dock {
                width: 250px
            }

            #dock {
                min-height: 0
            }

            .ttl {
                font-size: 24px
            }
        }

        .top {
            position: static;
            gap: 10px
        }

        .card {
            max-height: 94vh;
            overflow: auto
        }

        .opt.sm {
            font-size: 12px;
            padding: 9px 2px
        }

        #board .tk {
            width: 6.4%
        }

        #board .tki {
            background: none;
            border: none;
            box-shadow: none;
            border-radius: 0;
            transform-origin: 50% 90%
        }

        #board .tki::before {
            content: "";
            position: absolute;
            left: 24%;
            top: -8%;
            width: 52%;
            height: 52%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fffa, transparent 42%), var(--tc);
            border: 2px solid #fff;
            box-sizing: border-box;
            box-shadow: 0 2px 3px #0008
        }

        #board .tki::after {
            inset: auto;
            left: 8%;
            bottom: -6%;
            width: 84%;
            height: 66%;
            border-radius: 50% 50% 14% 14%/80% 80% 14% 14%;
            background: linear-gradient(90deg, #0005, transparent 40%, #fff5 62%, #0004), var(--tc);
            border: 2px solid #fff;
            box-shadow: 0 3px 5px #000a
        }

        #board[data-tk="1"] .tki::before,
        #board[data-tk="1"] .tki::after {
            border-color: #ffd54f
        }

        #board[data-tk="1"] .tki::before {
            box-shadow: 0 0 7px #ffd54f, 0 2px 3px #0008
        }

        #board[data-tk="1"] .tki::after {
            box-shadow: 0 0 6px #ffd54f55, 0 3px 5px #000a
        }

        #board[data-tk="2"] .tki::before {
            left: 28%;
            width: 44%;
            height: 44%;
            top: -4%
        }

        #board[data-tk="2"] .tki::after {
            left: 22%;
            width: 56%;
            height: 76%;
            border-radius: 50% 50% 10% 10%/90% 90% 10% 10%
        }

        body[data-th="4"] {
            background: radial-gradient(circle at 50% 0, #29b6f6, #01283f 75%)
        }

        body[data-th="5"] {
            background: radial-gradient(circle at 50% 0, #7c4dff, #020014 75%)
        }

        .tk.can .tki {
            filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 7px #ffe082)
        }

        #chat {
            position: fixed;
            left: 50%;
            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            width: min(94vw, 420px);
            box-sizing: border-box;
            background: #2a1a6af2;
            border: 1px solid #fff3;
            border-radius: 18px;
            padding: 12px;
            z-index: 90;
            box-shadow: 0 10px 40px #000c;
            display: none;
            max-height: 60vh;
            overflow: auto
        }

        #chat.on {
            display: block;
            animation: cp .25s
        }

        @keyframes cp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px)
            }
        }

        #chat .eg,
        #chat .pg {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center
        }

        #chat .eg button {
            font-size: 24px;
            background: #ffffff1a;
            border: none;
            border-radius: 12px;
            width: 44px;
            height: 44px
        }

        #chat .pg {
            margin-top: 8px
        }

        #chat .pg button {
            background: #ffffff1f;
            border: 1px solid #fff3;
            border-radius: 16px;
            padding: 7px 12px;
            font-size: 13px
        }

        .em.bub {
            font-size: calc(var(--s)/26);
            background: #fff;
            color: #222;
            padding: 6px 10px;
            border-radius: 14px;
            white-space: nowrap;
            font-weight: 700;
            box-shadow: 0 4px 10px #0007
        }

        .ad {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            text-align: left;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 16px;
            background: linear-gradient(120deg, #0d47a1, #00897b);
            border: 1px solid #fff4;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 18px #0006
        }

        .ad::after {
            content: "";
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(100deg, transparent, #fff5, transparent);
            transform: skewX(-20deg);
            animation: sh2 2.6s infinite
        }

        @keyframes sh2 {
            to {
                left: 130%
            }
        }

        .ad .ic {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            flex: none;
            background: repeating-conic-gradient(#f0d9b5 0 25%, #b58863 0 50%) 0 0/50% 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #222;
            text-shadow: 0 0 4px #fff;
            animation: ab 1.4s ease-in-out infinite alternate
        }

        @keyframes ab {
            to {
                transform: translateY(-4px) rotate(-8deg)
            }
        }

        .ad b {
            display: block;
            font-size: 15px;
            letter-spacing: 1px
        }

        .ad small {
            display: block;
            font-size: 11px;
            opacity: .9;
            line-height: 1.35
        }

        .ad em {
            position: absolute;
            top: 3px;
            right: 8px;
            font-size: 9px;
            font-style: normal;
            opacity: .75;
            border: 1px solid #fff6;
            padding: 0 4px;
            border-radius: 4px
        }

        .ad u {
            margin: 6px 0 0 auto;
            text-decoration: none;
            background: #ffd54f;
            color: #3e2a00;
            font-weight: 800;
            font-size: 12px;
            padding: 7px 11px;
            border-radius: 10px;
            flex: none;
            box-shadow: 0 3px 0 #b28900
        }

        #adc {
            position: fixed;
            left: 14px;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            width: 270px;
            z-index: 30;
            display: none
        }

        @media (min-width:1000px) {
            #adc {
                display: block
            }
        }
    </style>
</head>

<body>
    <div class="ttl">LUDO KING</div>
    <div class="by">by Keshav Mishra</div>
    <div id="bar"></div>
    <div id="board">
        <div id="grid"></div>
    </div>
    <div id="dock">
        <div id="die" class="die"></div>
        <div id="msg"></div>
    </div>
    <div id="emo"><button>😂</button><button>😡</button><button>😭</button><button>😎</button><button>👏</button><button
            id="chb">💬</button></div>
    <div id="chat"></div>
    <div class="top"><button id="th" title="Theme">🎨</button><button id="tk" title="Goti style">♟</button><button
            id="fs" title="Fullscreen">⛶</button><button id="sn" title="Sound">🔊</button><button id="mn"
            title="Menu">☰</button></div>
    <div id="spl" class="ov">
        <div class="big">🎲</div>
        <div class="ttl" style="font-size:40px">LUDO KING</div>
        <div class="by">by Keshav Mishra</div>
        <div class="lb"><i></i></div>
    </div>
    <div id="menu" class="ov">
        <div class="card">
            <h2>LUDO KING</h2>
            <p>by Keshav Mishra</p>
            <h4>Players</h4>
            <div class="row"><button class="opt" data-n="2">2</button><button class="opt" data-n="3">3</button><button
                    class="opt" data-n="4">4</button></div>
            <h4>Mode</h4>
            <div class="row"><button class="opt" data-m="cpu">vs Computer</button><button class="opt" data-m="pvp">Pass
                    &amp; Play</button></div>
            <h4>Level (vs Computer)</h4>
            <div class="row"><button class="opt sm" data-l="0">😊 Easy</button><button class="opt sm" data-l="1">🙂
                    Medium</button><button class="opt sm" data-l="2">😈 Hard</button><button class="opt sm"
                    data-l="3">👑 Pro</button></div>
            <h4>Goti Style</h4>
            <div class="row" id="tks"></div>
            <h4>Rules</h4>
            <div class="row"><button class="opt" data-q="0">Classic</button><button class="opt" data-q="1">Quick (1

    </div>
    <div id="pz" class="ov hide">

        </div>
    </div>
    <script>
        const P = [[6, 1], [6, 2], [6, 3], [6, 4], [6, 5], [5, 6], [4, 6], [3, 6], [2, 6], [1, 6], [0, 6], [0, 7], [0, 8], [1, 8], [2, 8], [3, 8], [4, 8], [5, 8], [6, 9], [6, 10], [6, 11], [6, 12], [6, 13], [6, 14], [7, 14], [8, 14], [8, 13], [8, 12], [8, 11], [8, 10], [8, 9], [9, 8], [10, 8], [11, 8], [12, 8], [13, 8], [14, 8], [14, 7], [14, 6], [13, 6], [12, 6], [11, 6], [10, 6], [9, 6], [8, 5], [8, 4], [8, 3], [8, 2], [8, 1], [8, 0], [7, 0], [6, 0]];
        const ST = [0, 13, 26, 39], SAFE = [0, 8, 13, 21, 26, 34, 39, 47];
        const LANE = [[1, 2, 3, 4, 5].map(i => [7, i]), [1, 2, 3, 4, 5].map(i => [i, 7]), [13, 12, 11, 10, 9].map(i => [7, i]), [13, 12, 11, 10, 9].map(i => [i, 7])];
        const COL = ['#e53935', '#2e9e44', '#f9b600', '#1e88e5'], NAME = ['Red', 'Green', 'Yellow', 'Blue'];
        const YO = [[0, 0], [0, 9], [9, 9], [9, 0]], F = [0, [4], [0, 8], [0, 4, 8], [0, 2, 6, 8], [0, 2, 4, 6, 8], [0, 2, 3, 5, 6, 8]];
        const $ = id => document.getElementById(id), sleep = async ms => { await new Promise(r => setTimeout(r, ms)); while (PZ) await new Promise(r => setTimeout(r, 120)) };
        let S = null, N = 4, M = 'cpu', Q = 0, TH = 0, TK = 0, LV = 1, PZ = 0, YB = [], AC, mute = false;
        function beep(f, d = .08, t = 'sine') { if (mute) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state == 'suspended') AC.resume(); const o = AC.createOscillator(), g = AC.createGain(); o.type = t; o.frequency.value = f; g.gain.setValueAtTime(.1, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + d); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d) } catch (e) { } }
        function xy(c, t, i) {
            const p = t.p; if (p < 0) return [YO[c][0] + (i < 2 ? 2 : 4), YO[c][1] + (i % 2 ? 4 : 2)]; let r, k;
            if (p <= 50) [r, k] = P[(ST[c] + p) % 52]; else if (p < 56) [r, k] = LANE[c][p - 51];
            else return [7.5 + [0, -.8, 0, .8][c], 7.5 + [-.8, 0, .8, 0][c]]; return [r + .5, k + .5]
        }
        function build() {
            const col = {}, star = {}; LANE.forEach((l, c) => l.forEach(([r, k]) => col[r + ',' + k] = c)); ST.forEach((s, c) => col[P[s][0] + ',' + P[s][1]] = c); SAFE.forEach(a => star[P[a][0] + ',' + P[a][1]] = 1);
            let h = ''; for (let r = 0; r < 15; r++)for (let c = 0; c < 15; c++) {
                const q = r < 6 && c < 6 ? 0 : r < 6 && c > 8 ? 1 : r > 8 && c > 8 ? 2 : r > 8 && c < 6 ? 3 : -1, k = r + ',' + c;
                if (q >= 0) h += `<div class="c y" style="background:${COL[q]}"></div>`;
                else if (r > 5 && r < 9 && c > 5 && c < 9) h += '<div class="c n"></div>';
                else { const cc = col[k], s = star[k] ? '★' : ''; h += `<div class="c${s ? ' st' : ''}" style="${cc !== undefined ? 'background:' + COL[cc] + ';color:#fffb' : ''}">${s}</div>` }
            }
            $('grid').innerHTML = h; const B = $('board'); B.insertAdjacentHTML('beforeend', '<div id="ctr"></div>');
            for (let c = 0; c < 4; c++) {
                const y = document.createElement('div'); y.className = 'yb'; y.style.cssText = `left:${(YO[c][1] + 1) / 15 * 100}%;top:${(YO[c][0] + 1) / 15 * 100}%;--gc:${COL[c]}`; B.appendChild(y); YB[c] = y;
                for (let i = 0; i < 4; i++) { const [yy, x] = xy(c, { p: -1 }, i), s = document.createElement('div'); s.className = 'slot'; s.style.cssText = `left:${x / 15 * 100}%;top:${yy / 15 * 100}%;--sc:${COL[c]}`; B.appendChild(s) }
            }
            $('die').innerHTML = '<i></i>'.repeat(9); face(6)
        }
        function face(v) { document.querySelectorAll('#die i').forEach((e, k) => e.className = F[v].includes(k) ? 'p' : '') }
        function layout() {
            const g = {}; S.pl.forEach(pl => pl.t.forEach((t, i) => { const [y, x] = xy(pl.c, t, i); (g[y + ',' + x] = g[y + ',' + x] || []).push([t, y, x]) }));
            for (const k in g) {
                const a = g[k], n = a.length; a.forEach(([t, y, x], j) => {
                    const dx = n > 1 ? (j - (n - 1) / 2) * .32 : 0, s = t.p == 56 ? (n > 1 ? .5 : .65) : n > 1 ? (n > 2 ? .6 : .72) : 1;
                    t.el.style.left = (x + dx) / 15 * 100 + '%'; t.el.style.top = y / 15 * 100 + '%'; t.el.style.setProperty('--sc', s); t.el.style.zIndex = 10 + Math.round(y) + j
                })
            }
        }
        function burst(x, y, col, n = 10, sp = 40) { const B = $('board'); for (let i = 0; i < n; i++) { const e = document.createElement('div'), a = Math.random() * 6.28, d = sp * (.5 + Math.random()); e.className = 'pt'; e.style.cssText = `left:${x / 15 * 100}%;top:${y / 15 * 100}%;--pc:${col};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`; B.appendChild(e); setTimeout(() => e.remove(), 750) } }
        function react(c, em) { if (c == null) return; const y = YO[c][0] + 3, x = YO[c][1] + 3, e = document.createElement('div'); e.className = 'em' + ([...em].length > 2 ? ' bub' : ''); e.textContent = em; e.style.cssText = `left:${x / 15 * 100}%;top:${y / 15 * 100}%`; $('board').appendChild(e); beep(700, .08, 'triangle'); setTimeout(() => e.remove(), 1700) }
        const EM = ['😂', '😡', '😭', '😎', '👏', '😍', '🥳', '🤯', '😱', '🤬', '🙏', '🔥', '💪', '🤝', '😈', '🥶', '🤔', '😴', '💀', '🎉', '👑', '😜', '🤡', '🥲'], PH = ['Well played! 👏', 'Nice move 👌', 'Oops! 😅', 'Mar gaya! 😜', 'Jaldi chalo ⏳', 'Bachke rehna 😈', 'Kya baat hai! 🔥', 'GG 🤝'], TKN = ['♟ Classic', '👑 Gold', '♙ Slim'];
        function me(t) { if (S) react(S.pl[M == 'cpu' ? 0 : S.cur].c, t) }
        function say(pl, a, pr = 1) { if (pl && pl.cpu && Math.random() < pr) setTimeout(() => { if (S) react(pl.c, a[Math.random() * a.length | 0]) }, 300 + Math.random() * 500) }
        const prog = p => p.t.reduce((a, t) => a + t.p + 1, 0);
        function situ(pl) { const m = prog(pl), b = Math.max(...S.pl.filter(p => p !== pl).map(prog)); if (m + 25 < b) say(pl, ['😰', '🥶', 'Jaldi chalo ⏳', 'Hmm 🤔'], .15); else if (m > b + 25) say(pl, ['😎', 'Easy game 😏', '😈'], .15) }
        function sv() { try { localStorage.setItem('lk', JSON.stringify({ TH, TK, mute, LV })) } catch (e) { } }
        function setTK(k) { TK = k; $('board').dataset.tk = k; document.querySelectorAll('#tks button').forEach((b, i) => b.classList.toggle('sel', i == k)); sv() }
        function hop(t) { t.el.classList.remove('hop'); void t.el.offsetWidth; t.el.classList.add('hop') }
        function bar() { $('bar').innerHTML = S.pl.map((p, k) => `<div class="chip${k == S.cur && !S.over ? ' on' : ''}" style="--c:${COL[p.c]}"><b></b>${p.name} <small>${p.done}/${Q ? 1 : 4}</small></div>`).join(''); YB.forEach((y, c) => y.classList.toggle('act', !S.over && S.pl[S.cur].c == c)) }
        function msg(t) { const m = $('msg'); m.textContent = t; m.classList.remove('p'); void m.offsetWidth; m.classList.add('p') }
        function start() {
            PZ = 0; $('pz').classList.add('hide'); document.querySelectorAll('.tk,.cf').forEach(e => e.remove()); $('menu').classList.add('hide'); $('end').classList.add('hide');
            const seats = { 2: [0, 2], 3: [0, 1, 2], 4: [0, 1, 2, 3] }[N];
            const G = S = { pl: seats.map((c, k) => ({ c, cpu: M == 'cpu' && k > 0, done: 0, fin: false, name: M == 'cpu' ? (k ? 'CPU ' + NAME[c] : 'You') : NAME[c], t: [0, 1, 2, 3].map(() => ({ p: -1 })) })), cur: 0, phase: 'roll', six: 0, v: 0, rank: [], can: [], over: false };
            G.pl.forEach(pl => pl.t.forEach((t, i) => {
                const e = document.createElement('div'); e.className = 'tk'; e.innerHTML = '<div class="tki"></div>'; e.style.setProperty('--tc', COL[pl.c]); t.el = e; $('board').appendChild(e);
                e.onclick = () => { if (S === G && G.phase == 'move' && G.pl[G.cur] === pl && G.can.includes(i)) go(pl, i, G.v) }
            }));
            layout(); turn()
        }
        function turn() {
            const pl = S.pl[S.cur]; S.phase = 'roll'; bar(); msg(pl.cpu ? pl.name + ' is thinking…' : pl.name + "'s turn — tap the dice");
            const d = $('die'); d.style.setProperty('--pc', COL[pl.c]); d.classList.toggle('ready', !pl.cpu); if (pl.cpu) { const G = S; situ(pl); setTimeout(() => { if (S === G) roll() }, 900) }
        }
        function next(extra) { if (!extra) { S.six = 0; do S.cur = (S.cur + 1) % S.pl.length; while (S.pl[S.cur].fin) } turn() }
        async function roll() {
            if (S.phase != 'roll') return; if (PZ) { const G = S; setTimeout(() => { if (S === G) roll() }, 250); return } const G = S; G.phase = 'anim'; const d = $('die'); d.classList.remove('ready'); d.classList.add('roll');
            for (let i = 0; i < 8; i++) { face(1 + Math.random() * 6 | 0); beep(260 + i * 35, .04); await sleep(75) }
            if (G !== S) return; d.classList.remove('roll'); const v = 1 + Math.random() * 6 | 0; G.v = v; face(v); beep(700, .12, 'triangle'); d.classList.add('land'); setTimeout(() => d.classList.remove('land'), 400); after(G, v)
        }
        const can = (t, v) => t.p < 0 ? v == 6 : t.p + v <= 56;
        async function after(G, v) {
            const pl = G.pl[G.cur]; if (v == 6) { G.six++; if (pl.cpu) say(pl, ['🔥', '😎'], .3); else G.pl.forEach(o => say(o, ['😱', '🤯', '😮'], .25)) } else G.six = 0;
            if (G.six == 3) { msg('Three 6s in a row! Turn lost'); await sleep(1200); if (G !== S) return; return next(false) }
            const mv = [0, 1, 2, 3].filter(i => can(pl.t[i], v));
            if (!mv.length) { msg(pl.name + ': no move possible'); await sleep(1000); if (G !== S) return; return next(false) }
            if (pl.cpu) { msg(pl.name + ' rolled ' + v); await sleep(650); if (G !== S) return; return go(pl, pick(pl, mv, v), v) }
            if (mv.length == 1 || mv.every(i => pl.t[i].p < 0)) { await sleep(300); if (G !== S) return; return go(pl, mv[0], v) }
            G.phase = 'move'; G.can = mv; mv.forEach(i => pl.t[i].el.classList.add('can')); msg('Tap a token to move it')
        }
        const abs = (pl, p) => (ST[pl.c] + p) % 52;
        function pick(pl, mv, v) {
            const R = () => mv[Math.random() * mv.length | 0]; if (LV == 0 || (LV == 1 && Math.random() < .35)) return R(); let best = -1e9, bi = mv[0]; for (const i of mv) {
                const t = pl.t[i], np = t.p < 0 ? 0 : t.p + v; let s = Math.random() * (LV > 1 ? 1 : 5) + np * .3; if (np == 56) s += 100; if (t.p < 0) s += 40; if (t.p <= 50 && np > 50) s += 25;
                if (np <= 50) { const a = abs(pl, np); if (SAFE.includes(a)) s += 15; else for (const o of S.pl) if (o !== pl) for (const u of o.t) if (u.p >= 0 && u.p <= 50) { const oa = abs(o, u.p); if (oa == a) s += 70; const d = (a - oa + 52) % 52; if (d >= 1 && d <= 6) s -= LV > 2 ? 20 : 12 } }
                if (t.p >= 0 && t.p <= 50 && !SAFE.includes(abs(pl, t.p))) for (const o of S.pl) if (o !== pl) for (const u of o.t) if (u.p >= 0 && u.p <= 50) { const d = (abs(pl, t.p) - abs(o, u.p) + 52) % 52; if (d >= 1 && d <= 6) { s += 10; break } }
                if (s > best) { best = s; bi = i }
            } return bi
        }
        async function go(pl, i, v) {
            const G = S; G.phase = 'anim'; G.can = []; document.querySelectorAll('.tk.can').forEach(e => e.classList.remove('can')); const t = pl.t[i]; let cap = false, fin = false;
            if (t.p < 0) { t.p = 0; hop(t); layout(); beep(520, .12); await sleep(350) }
            else for (let k = 0; k < v; k++) { t.p++; hop(t); layout(); { const [ty, tx] = xy(pl.c, t, i); burst(tx, ty, COL[pl.c], 4, 22) } beep(380 + t.p * 5, .05); await sleep(190); if (G !== S) return }
            if (t.p <= 50 && !SAFE.includes(abs(pl, t.p))) {
                const a = abs(pl, t.p), hit = []; for (const o of G.pl) if (o !== pl) for (const u of o.t) if (u.p >= 0 && u.p <= 50 && abs(o, u.p) == a) hit.push(u);
                if (hit.length) { cap = true; pl.cap = (pl.cap || 0) + hit.length; const [cy, cx] = xy(pl.c, t, i); burst(cx, cy, '#fff', 16, 60); burst(cx, cy, COL[pl.c], 12, 50); const vic = G.pl.find(o => o.t.includes(hit[0])); hit.forEach(u => { u.p = -1; u.el.classList.add('ret') }); $('board').classList.add('shake'); setTimeout(() => $('board').classList.remove('shake'), 450); navigator.vibrate && navigator.vibrate(70); if (pl.cpu) say(pl, ['😂', '😈', '😎', 'Mar gaya! 😜', 'Bachke rehna 😈']); else react(pl.c, '😎'); if (vic.cpu) say(vic, ['😭', '😡', '🤬', 'Oops! 😅', '🥲']); else setTimeout(() => react(vic.c, '😭'), 350); beep(200, .3, 'sawtooth'); layout(); msg('💥 Captured!'); await sleep(750); hit.forEach(u => u.el.classList.remove('ret')); if (G !== S) return }
            }
            if (t.p == 56) { fin = true; pl.done++; beep(880, .25, 'triangle'); msg('🏠 Token reached home!'); { const [hy, hx] = xy(pl.c, t, i); burst(hx, hy, '#ffe082', 18, 70); burst(hx, hy, COL[pl.c], 12, 55) } if (pl.cpu) say(pl, ['🥳', '🎉', '🔥', '🏠 Home!']); else { react(pl.c, '🏠'); G.pl.forEach(o => say(o, ['👏', '🤝', 'Well played! 👏'], .35)) } layout(); await sleep(500) }
            if (G !== S) return; if (pl.done >= (Q ? 1 : 4)) { pl.fin = true; G.rank.push(pl); const left = G.pl.filter(p => !p.fin); if (Q || left.length <= 1) { left.sort((a, b) => b.done - a.done).forEach(p => { p.fin = true; G.rank.push(p) }); return over() } }
            if (G !== S) return; const ex = (v == 6 || cap || fin) && !pl.fin; if (ex) { msg('🎲 Bonus roll!'); await sleep(550); if (G !== S) return } bar(); next(ex)
        }
        function over() {
            S.over = true; bar(); const m = ['🥇', '🥈', '🥉', '4️⃣']; beep(660, .2, 'triangle'); setTimeout(() => beep(880, .3, 'triangle'), 200);
            $('wt').textContent = '🏆 ' + S.rank[0].name + (S.rank[0].name == 'You' ? ' win!' : ' wins!');
            $('rks').innerHTML = S.rank.map((p, k) => `<div class="rk"><span>${m[k]}</span><b style="background:${COL[p.c]}"></b>${p.name}<small style="margin-left:auto;opacity:.8">⚔ ${p.cap || 0}</small></div>`).join(''); $('end').classList.remove('hide');
            for (let i = 0; i < 80; i++) { const c = document.createElement('div'); c.className = 'cf'; c.style.cssText = `left:${Math.random() * 100}%;background:${COL[i % 4]};animation-duration:${2 + Math.random() * 2.5}s;animation-delay:${Math.random() * 1.2}s`; document.body.appendChild(c) }
        }
        function sel() { document.querySelectorAll('[data-n]').forEach(b => b.classList.toggle('sel', +b.dataset.n == N)); document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('sel', b.dataset.m == M)); document.querySelectorAll('[data-q]').forEach(b => b.classList.toggle('sel', +b.dataset.q == Q)); document.querySelectorAll('[data-l]').forEach(b => b.classList.toggle('sel', +b.dataset.l == LV)) }
        document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { N = +b.dataset.n; sel() });
        document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { M = b.dataset.m; sel() });

        document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { LV = +b.dataset.l; sel(); sv() });
        $('th').onclick = () => { TH = (TH + 1) % 6; document.body.dataset.th = TH; beep(600, .1); sv(); msg(['Royal Night', 'Diwali Glow', 'Candy Land', 'Nature Park', 'Deep Ocean', 'Space Galaxy'][TH] + ' ✨') };
        $('tk').onclick = () => { setTK((TK + 1) % 3); beep(500, .1) };
        $('tks').innerHTML = TKN.map(n => `<button class="opt sm">${n}</button>`).join(''); document.querySelectorAll('#tks button').forEach((b, i) => b.onclick = () => setTK(i));
        $('chat').innerHTML = '<div class="eg">' + EM.map(e => `<button>${e}</button>`).join('') + '</div><div class="pg">' + PH.map(e => `<button>${e}</button>`).join('') + '</div>';
        $('chat').onclick = e => { if (e.target.tagName == 'BUTTON') { me(e.target.textContent); $('chat').classList.remove('on') } };
        $('chb').onclick = e => { e.stopPropagation(); $('chat').classList.toggle('on') };
        document.addEventListener('click', e => { if (!e.target.closest('#chat')) $('chat').classList.remove('on') });
        try { const L = JSON.parse(localStorage.getItem('lk') || '{}'); TH = (L.TH | 0) % 6; mute = !!L.mute; TK = Math.min(L.TK | 0, 2); LV = L.LV ?? 1 } catch (e) { }
        document.body.dataset.th = TH; $('sn').textContent = mute ? '🔇' : '🔊'; setTK(TK);
        document.querySelectorAll('#emo button:not(#chb)').forEach(b => b.onclick = () => me(b.textContent));
        setTimeout(() => $('spl').classList.add('out'), 1900); setTimeout(() => $('spl').remove(), 2600);
        $('start').onclick = start; $('again').onclick = start;
        function pause() { if (S && !S.over && $('menu').classList.contains('hide')) { PZ = 1; $('pz').classList.remove('hide') } }
        $('mn').onclick = () => { if (S && !S.over) pause(); else $('menu').classList.remove('hide') };
        $('rs').onclick = () => { PZ = 0; $('pz').classList.add('hide') };
        $('rt').onclick = () => { $('pz').classList.add('hide'); start() };
        $('hm').onclick = () => { $('pz').classList.add('hide'); $('menu').classList.remove('hide') };
        $('hm2').onclick = () => { $('end').classList.add('hide'); $('menu').classList.remove('hide') };

        $('fs').onclick = () => { const d = document, e = d.documentElement; if (d.fullscreenElement) d.exitFullscreen(); else if (e.requestFullscreen) e.requestFullscreen() }; if (!document.fullscreenEnabled) $('fs').remove();
        $('sn').onclick = () => { mute = !mute; $('sn').textContent = mute ? '🔇' : '🔊'; sv() };
        $('die').onclick = () => { if (S && S.phase == 'roll' && !S.pl[S.cur].cpu) roll() };
        const CHESS_URL = 'https://mkeshav872-png.github.io/Chess-Queen/';
        const AD = `<a class="ad" href="${CHESS_URL}" target="_blank" rel="noopener"><div class="ic">♛</div><div><b>CHESS QUEEN</b><small>Think • Plan • Checkmate!<br>Made by Keshav Mishra</small></div><u>PLAY</u><em>AD</em></a>`;
        ['#menu', '#pz', '#end'].forEach(q => { const d = document.createElement('div'); d.innerHTML = AD; document.querySelector(q + ' .card').appendChild(d.firstChild) });
        { const d = document.createElement('div'); d.id = 'adc'; d.innerHTML = AD; document.body.appendChild(d) }
        build(); sel();
    </script>
